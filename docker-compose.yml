# Demo setup: sample data, phpMyAdmin and every port exposed.
# For production, use docker-compose.prod.yml instead.
name: restoqr-demo

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" # Empty root password, for local use only
      MYSQL_DATABASE: pfe_restoQR
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro # Sample data, loaded only when the volume is empty
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"] # TCP, so it fails while MySQL is still initializing
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 512M
    ports:
      - "8081:80"
    depends_on:
      - mysql

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pfe_restoQR?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    ports:
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy # Wait until MySQL accepts connections
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "4200:80" # nginx serves the app and forwards /api/ to the backend
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
