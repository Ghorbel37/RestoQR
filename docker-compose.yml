services:
  mysql:
    image: mysql:8.0
    container_name: restoqr-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" # Empty root password, for local development only
      MYSQL_DATABASE: pfe_restoQR
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: restoqr-phpmyadmin
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 512M
      POST_MAX_SIZE: 512M
      MAX_EXECUTION_TIME: 600
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: restoqr-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pfe_restoQR?serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    ports:
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy # Wait until MySQL accepts connections
    restart: on-failure
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: restoqr-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
