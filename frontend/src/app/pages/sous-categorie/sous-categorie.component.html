<form>
    <div [align]="['center']">
        <div>
            <mat-form-field>
                <mat-label>Sous categorie</mat-label>
                <input matInput type="text" placeholder="Entrées, Desserts, etc." [(ngModel)]="newSousCategorie.nom"
                    name="nom">
            </mat-form-field>
            <button mat-raised-button color="primary" [disabled]="" (click)="submit()">Créer</button>
        </div>
    </div>
</form>
<mat-divider></mat-divider>


<div>
    <mat-card>
        <mat-card-content>
            <h2>Sous Categories</h2>

            <table mat-table [dataSource]="existingSousCategories">

                <!-- nom column -->
                <ng-container matColumnDef="nom">
                    <th mat-header-cell *matHeaderCellDef> Sous categorie </th>
                    <td mat-cell *matCellDef="let sousCategorie"> {{sousCategorie.nom}} </td>
                </ng-container>

                <!-- id column -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef> Id </th>
                    <td mat-cell *matCellDef="let sousCategorie"> {{sousCategorie.idSous_Categorie}} </td>
                </ng-container>

                <!-- action column -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td mat-cell *matCellDef="let sousCategorie">
                        <button mat-icon-button>
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button (click)="delete(sousCategorie.idSous_Categorie)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
                <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>
