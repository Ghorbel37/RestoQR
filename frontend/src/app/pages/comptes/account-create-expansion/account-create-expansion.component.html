<mat-expansion-panel hideToggle #expansion>
    <mat-expansion-panel-header>
        <mat-panel-title>
            Créer compte
        </mat-panel-title>
        <mat-panel-description>
            <mat-icon>add</mat-icon>
        </mat-panel-description>
    </mat-expansion-panel-header>

    <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="user.email" name="email" required>
        <mat-error>
            Email est obligatoire
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Mot de passe</mat-label>
        <input matInput [(ngModel)]="user.password" name="password" required>
        <mat-error>
            Mot de passe est obligatoire
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Mot de passe</mat-label>
        <input matInput [(ngModel)]="user.password" name="password" required>
        <mat-error>
            Mot de passe est obligatoire
        </mat-error>
    </mat-form-field>

    <mat-form-field>
        <mat-label>Role</mat-label>
        <mat-select>
            <mat-option *ngFor="let role of roles" [value]="role">
                {{role}}
            </mat-option>
        </mat-select>
    </mat-form-field>

    <mat-action-row>
        <button mat-button color="primary" (click)="submit();expansion.close()">Créer</button>
    </mat-action-row>

</mat-expansion-panel>
