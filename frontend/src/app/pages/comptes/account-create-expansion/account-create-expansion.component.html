<mat-expansion-panel hideToggle #expansion>
    <mat-expansion-panel-header>
        <mat-panel-title>
            Créer compte
        </mat-panel-title>
        <mat-panel-description>
            <mat-icon>add</mat-icon>
        </mat-panel-description>
    </mat-expansion-panel-header>

    <div class="form-fields">
        <mat-form-field appearance="fill">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="user.email" #email="ngModel" required>
            <mat-error>
                Email est obligatoire
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Mot de passe</mat-label>
            <input matInput [(ngModel)]="user.password" [type]="hide ? 'password' : 'text'" #password="ngModel"
                required>
            <mat-icon matSuffix (click)="hide = !hide">{{!hide ? 'visibility_off' :'visibility'}}</mat-icon>
            <mat-error>
                Mot de passe est obligatoire
            </mat-error>
        </mat-form-field>
        <!-- <mat-form-field appearance="fill">
            <mat-label>Mot de passe</mat-label>
            <input matInput [(ngModel)]="user.password" name="password" required>
            <mat-error>
                Mot de passe est obligatoire
            </mat-error>
        </mat-form-field> -->
        <mat-form-field>
            <mat-label>Role</mat-label>
            <mat-select [(ngModel)]="user.role" #role="ngModel" required>
                <mat-option *ngFor="let role of roles | keyvalue" [value]="role.key">
                    {{role.value}}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <mat-action-row>
        <button mat-button color="primary" [disabled]="email.invalid||password.invalid||role.invalid"
            (click)="submit();expansion.close()">Créer</button>
    </mat-action-row>

</mat-expansion-panel>
