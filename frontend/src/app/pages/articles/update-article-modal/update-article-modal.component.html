<h1 mat-dialog-title>Mise a jour article</h1>
<div mat-dialog-content>
    <p>Informations articles</p>
    <mat-form-field appearance="fill">
        <mat-label>Libelle</mat-label>
        <input matInput [(ngModel)]="article.libelle">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Description</mat-label>
        <input matInput [(ngModel)]="article.description">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Prix</mat-label>
        <input matInput [(ngModel)]="article.prix">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Reference</mat-label>
        <input matInput [(ngModel)]="article.reference">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Duree</mat-label>
        <input matInput [(ngModel)]="article.duree">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Categorie</mat-label>
        <mat-select [(value)]="idCategorie">
            <mat-option [value]="null">--</mat-option>
            <mat-option *ngFor="let categorie of categories" [value]="categorie.idCategorie">
                {{categorie.nom}}
            </mat-option>
        </mat-select>
    </mat-form-field>

    <div class="center">
        <mat-label *ngIf="article.image">Image</mat-label><br>
        <img [src]="article.image" *ngIf="article.image">
    </div>

    <input type="file" class="file-input" (change)="changeListener($event)" accept="image/png, image/jpeg" #fileUpload>
    <div class="file-upload">
        <button mat-mini-fab color="primary" class="upload-btn" (click)="fileUpload.click()">
            <mat-icon>attach_file</mat-icon>
        </button>
        {{fileName ||"Aucun fichier choisi"}}
    </div>

</div>
<div mat-dialog-actions>
    <button mat-button [mat-dialog-close]="false">Annuler</button>
    <button mat-button (click)="close()" color="primary" cdkFocusInitial>Modifier</button>
</div>
