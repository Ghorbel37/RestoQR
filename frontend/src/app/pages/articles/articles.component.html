<app-create-article-expansion (refresh)="refresh()"></app-create-article-expansion>
<mat-divider></mat-divider>


<div class="center">
    <mat-card class="article-card">
        <mat-card-content>
            <h2>Articles</h2>
            <mat-form-field class="form-field">
                <mat-icon matPrefix>search</mat-icon>
                <mat-label> Chercher</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Ex. salade" #input>
                <button mat-icon-button *ngIf="input.value" matSuffix (click)="input.value='';dataSource.filter =''">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>

            <table mat-table [dataSource]="dataSource" matSort>

                <!-- libelle column -->
                <ng-container matColumnDef="libelle">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Libelle </th>
                    <td mat-cell *matCellDef="let article"> {{article.libelle}} </td>
                </ng-container>

                <!-- description column -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Description </th>
                    <td mat-cell *matCellDef="let article"> {{article.description}} </td>
                </ng-container>

                <!-- prix column -->
                <ng-container matColumnDef="prix">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Prix </th>
                    <td mat-cell *matCellDef="let article"> {{article.prix | currency:'TND':'code'}}
                    </td>
                </ng-container>

                <!-- categorie column -->
                <ng-container matColumnDef="categorie">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="categorie.nom"> Categorie </th>
                    <td mat-cell *matCellDef="let article"> <span *ngIf="article.categorie">
                            {{article.categorie.nom}}</span>
                    </td>
                </ng-container>

                <!-- reference column -->
                <ng-container matColumnDef="reference">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Reference </th>
                    <td mat-cell *matCellDef="let article"> {{article.reference}}
                    </td>
                </ng-container>

                <!-- duree column -->
                <ng-container matColumnDef="duree">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Duree </th>
                    <td mat-cell *matCellDef="let article"> {{article.duree}}
                    </td>
                </ng-container>

                <!-- image column -->
                <ng-container matColumnDef="image">
                    <th mat-header-cell *matHeaderCellDef> Image </th>
                    <td mat-cell *matCellDef="let article"> <img [src]="article.image" *ngIf="article.image">
                    </td>
                </ng-container>

                <!-- action column -->
                <ng-container matColumnDef="action" stickyEnd>
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td mat-cell *matCellDef="let article">
                        <button mat-icon-button color="primary" (click)="update(article)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="delete(article.idArticle)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
                <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>

                <tr *matNoDataRow>
                    <td><b>Aucun article existant</b></td>
                </tr>

            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]"></mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
