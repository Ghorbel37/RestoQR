<div class="qr-code">
    <div class="center-card">
        <mat-card>
            <mat-card-content>
                <h2 style="text-align: center;">QR Code restaurant</h2>
                <qrcode #qrCode [qrdata]="qrData" [cssClass]="'center'" [elementType]="'url'"
                    [errorCorrectionLevel]="'M'" [margin]="1" [scale]="1" [width]="250"></qrcode>
                <button mat-raised-button color="primary" (click)="printPdf(qrCode,4)" class="center">Imprimer</button>
            </mat-card-content>
        </mat-card>
    </div>

    <div class="center-card" *ngIf="tables">
        <mat-card>
            <mat-card-content>
                <h2 style="text-align: center;">QR Code table</h2>
                <qrcode #qrCode [qrdata]="tableUrl(selectedTable)" [cssClass]="'center'" [elementType]="'url'"
                    [errorCorrectionLevel]="'M'" [margin]="1" [scale]="1" [width]="250"></qrcode>
                <mat-form-field appearance="fill">
                    <mat-label>Tables</mat-label>
                    <mat-select [(value)]="selectedTable">
                        <mat-option *ngFor="let table of tables" [value]="table.idTable">
                            Table {{table.numero}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <button mat-raised-button color="primary" (click)="printPdf(qrCode,4)" class="center">Imprimer</button>

            </mat-card-content>
        </mat-card>
    </div>
</div>
