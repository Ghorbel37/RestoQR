<mat-card class="center">
    <mat-accordion>
        <mat-expansion-panel *ngFor="let categorie of categories" hideToggle>
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <img class="img-categorie" [src]="categorie.image" />
                </mat-panel-title>
                <mat-panel-description> {{categorie.nom}} </mat-panel-description>
            </mat-expansion-panel-header>
            <mat-card *ngFor="let article of categorie.articles" class="example-card">
                <mat-card-header>
                    <img mat-card-sm-image [src]="article.image" />
                    <mat-card-title-group>
                        <mat-card-title>{{article.libelle}}</mat-card-title>
                        <mat-card-subtitle>{{article.description}}<br />
                            {{article.prix}}TND|{{article.duree}}
                        </mat-card-subtitle>
                    </mat-card-title-group>
                </mat-card-header>
                <mat-divider></mat-divider>
                <mat-card-actions>
                    <button mat-mini-fab (click)="removeFromCart(article)">
                        <mat-icon>remove</mat-icon>
                    </button>
                    <button mat-mini-fab (click)="addToCart(article)">
                        <mat-icon>add</mat-icon>
                    </button>
                </mat-card-actions>
            </mat-card>
        </mat-expansion-panel>

    </mat-expansion-panel> -->

</mat-card>

<button mat-fab id="button-cart" color="accent" *ngIf="panier.panier" [matBadge]="panier.quantitePanier"
    matBadgePosition="before" matBadgeColor="accent" routerLink="/panier" matTooltip="Panier">
    <mat-icon>shopping_cart</mat-icon>
</button>
