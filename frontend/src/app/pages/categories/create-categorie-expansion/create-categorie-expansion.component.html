<mat-expansion-panel hideToggle>
    <mat-expansion-panel-header>
        <mat-panel-title>
            Nouvelle categorie
        </mat-panel-title>
        <mat-panel-description>
            <mat-icon>add</mat-icon>
        </mat-panel-description>
    </mat-expansion-panel-header>

    <mat-form-field appearance="fill">
        <mat-label>Nom categorie</mat-label>
        <input matInput placeholder="Entrées, Desserts, etc." [(ngModel)]="categorie.nom" name="nom" required>
        <mat-error>
            Le nom est obligatoire
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Image</mat-label>
        <input matInput type="number" min="1">
    </mat-form-field>
    <input type="file" class="file-input" #fileUpload>
    <div class="file-upload">
        {{"Aucun fichier choisi"}}
        <button mat-mini-fab color="primary" class="upload-btn" (click)="fileUpload.click()">
            <mat-icon>attach_file</mat-icon>
        </button>
    </div>

    <mat-action-row>
        <button mat-button color="primary" (click)="submit()">Créer</button>
    </mat-action-row>

</mat-expansion-panel>
