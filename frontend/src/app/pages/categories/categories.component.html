<div class="center">
    <mat-card>
        <mat-card-content>
            <h2>Categories</h2>
            <mat-form-field class="form-field">
                <mat-icon matPrefix>search</mat-icon>
                <mat-label> Chercher</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Ex. desserts" #input>
                <button mat-icon-button *ngIf="input.value" matSuffix (click)="input.value='';dataSource.filter =''">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>

            <table mat-table [dataSource]="dataSource" matSort>

                <!-- nom column -->
                <ng-container matColumnDef="nom">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom </th>
                    <td mat-cell *matCellDef="let categorie"> {{categorie.nom}} </td>
                </ng-container>

                <!-- id column -->
                <ng-container matColumnDef="idCategorie">
                    <th mat-header-cell *matHeaderCellDef> Id </th>
                    <td mat-cell *matCellDef="let categorie"> {{categorie.idCategorie}} </td>
                </ng-container>

                <!-- image column -->
                <ng-container matColumnDef="image">
                    <th mat-header-cell *matHeaderCellDef> Image </th>
                    <td mat-cell *matCellDef="let categorie"> <img [src]="categorie.image" *ngIf="categorie.image">
                    </td>
                </ng-container>

                <!-- active column -->
                <ng-container matColumnDef="active">
                    <th mat-header-cell *matHeaderCellDef> Active </th>
                    <td mat-cell *matCellDef="let categorie">
                        <mat-slide-toggle [checked]="categorie.active"
                            (click)="toggleActive(categorie.idCategorie,categorie)" color="accent"></mat-slide-toggle>
                    </td>
                </ng-container>

                <!-- action column -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td mat-cell *matCellDef="let categorie">
                        <button mat-icon-button color="primary" (click)="update(categorie)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="delete(categorie.idCategorie)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
                <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>

                <tr *matNoDataRow>
                    <td><b>Aucune categorie existante</b></td>
                </tr>

            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]"></mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
