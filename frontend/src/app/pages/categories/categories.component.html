<div class="center">
    <mat-card>
        <mat-card-content>
            <h2>Categories</h2>

            <table mat-table [dataSource]="existingCategories">

                <!-- nom column -->
                <ng-container matColumnDef="nom">
                    <th mat-header-cell *matHeaderCellDef> Categorie </th>
                    <td mat-cell *matCellDef="let categorie"> {{categorie.nom}} </td>
                </ng-container>

                <!-- id column -->
                <ng-container matColumnDef="idCategorie">
                    <th mat-header-cell *matHeaderCellDef> Id </th>
                    <td mat-cell *matCellDef="let categorie"> {{categorie.idCategorie}} </td>
                </ng-container>

                <!-- image column -->
                <ng-container matColumnDef="image">
                    <th mat-header-cell *matHeaderCellDef> Image </th>
                    <td mat-cell *matCellDef="let categorie"> <img [src]="categorie.image" *ngIf="categorie.image">
                    </td>
                </ng-container>

                <!-- action column -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td mat-cell *matCellDef="let categorie">
                        <button mat-icon-button [routerLink]="['/', 'categories','edit', categorie.idCategorie]">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button (click)="delete(categorie.idCategorie)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
                <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>
