<!-- Top Toolbar -->
<mat-toolbar color="primary" id="toolbar-header">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>

  <span matTooltip="Menu">Restaurant</span>
  <span class="navbar-spacer"></span>
  <!-- <button mat-icon-button matTooltip="Panier">
    <mat-icon>shopping_cart</mat-icon>
  </button> -->
  <!-- <button mat-icon-button>
    <mat-icon>share</mat-icon>
  </button> -->
  <button mat-icon-button (click)="logout()" matTooltip="Déconnecter">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<!-- Body -->
<mat-sidenav-container class="navbar-sidenav-container">
  <!-- Sidenav content -->
  <mat-sidenav #sidenav mode="over">

    <div *ngIf="restaurant.logo">
      <div class="center-div" color="primary">
        <img class="avatar" [src]="restaurant.logo" />
        <h4 class="name">{{restaurant.nomRestaurant}}</h4>
      </div>
      <mat-divider></mat-divider>
    </div>

    <mat-nav-list>
      <!-- Nav list -->
      <span matSubheader>Admin</span>

      <!-- profile nav -->
      <a mat-list-item [routerLink]="['/profile']">
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle>Profile</span>
        <span matListItemLine>Gérer votre profile</span>
      </a>

      <!-- categorie nav -->
      <a mat-list-item [routerLink]="['/categories']">
        <mat-icon matListItemIcon>label</mat-icon>
        <span matListItemTitle>Categories</span>
        <span matListItemLine>Creer les categories</span>
      </a>

      <!-- articles nav -->
      <a mat-list-item [routerLink]="['/articles']">
        <mat-icon matListItemIcon>format_list_bulleted</mat-icon>
        <span matListItemTitle>Elements du menu</span>
        <span matListItemLine>Gérer les articles</span>
      </a>

      <!-- qrcode nav -->
      <a mat-list-item [routerLink]="['/codes']">
        <mat-icon matListItemIcon>qr_code</mat-icon>
        <span matListItemTitle>Qr code</span>
        <span matListItemLine>Créer les code Qr</span>
      </a>
      <!-- 
      <a mat-list-item [routerLink]="['/codes']">
        <mat-icon matListItemIcon>group_add</mat-icon>
        <span matListItemTitle>Clients</span>
        <span matListItemLine>Gérer les clients fideles</span>
      </a> -->

      <!-- <a mat-list-item [routerLink]="['/tables']">
        <mat-icon matListItemIcon>table_rows</mat-icon>
        <span matListItemTitle>Tables</span>
        <span matListItemLine>Gérer tables</span>
      </a> -->


      <mat-divider></mat-divider>

      <span matSubheader>Client</span>
      <a mat-list-item [routerLink]="['/menu']">
        <mat-icon matListItemIcon>storefront</mat-icon>
        <span matListItemTitle>Menu</span>
        <span matListItemLine>Consulter notre menu</span>
      </a>

      <!-- <a mat-list-item [routerLink]="['/codes']">
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Panier</span>
        <span matListItemLine>Modifier votre panier</span>
      </a> -->


    </mat-nav-list>

  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content>

    <!-- <div class="progress-bar-container">
      <mat-progress-bar color="accent" mode="indeterminate">
      </mat-progress-bar>
      <mat-spinner class="spinner" [diameter]="50" *ngIf="showSpinner"></mat-spinner>
    </div> -->

    <router-outlet></router-outlet>

    <!-- <footer id="footer">
      <span>Menu restaurant QR code </span>
    </footer> -->

  </mat-sidenav-content>

</mat-sidenav-container>
